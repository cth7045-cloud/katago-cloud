<!doctype html>
<!--
  KataGoVast web analysis screen.
  Look and drawing rules ported from LizzieYzy Next (https://github.com/wimi321/lizzieyzy-next):

<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KataGo 분석</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@600&display=swap" rel="stylesheet">
<style>
:root {
  --bar: #f0f0f0; --bar-line: #c9c9c9; --bar-text: #1a1a1a;
  --btn: #eef3fb; --btn-line: #9db2d3; --btn-text: #1a2a44; --btn-on: #cfe0fb;
  --btn-pink: #fdeef2; --btn-pink-line: #e3a9b9;
  --ui-font: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 13px/1.35 var(--ui-font); color: var(--bar-text); overflow: hidden;
  background: rgb(38, 38, 42) url("assets/background.jpg") repeat;
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100dvh; -webkit-text-size-adjust: 100%; }
button, select, input { font: inherit; color: var(--btn-text); }
button { background: var(--btn); border: 1px solid var(--btn-line); border-radius: 4px; padding: 3px 12px; min-height: 28px; white-space: nowrap; cursor: pointer; }
button:hover { background: #e2ebf8; }
button.on { background: var(--btn-on); border-color: #5f8fd6; }
button.pink { background: var(--btn-pink); border-color: var(--btn-pink-line); }
select, input[type=number], input[type=text] { background: #fff; border: 1px solid #b9b9b9; border-radius: 3px; padding: 2px 5px; min-height: 26px; }
input[type=number] { width: 62px; }
label.check { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }

/* Swing-like light bars (top / bottom) */
.menubar { display: flex; align-items: center; gap: 8px; padding: 4px 10px; background: var(--bar); border-bottom: 1px solid var(--bar-line);
  overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
.menubar > * { flex: none; }
.menubar .spacer { flex: 1 1 auto; }
.status { display: inline-flex; align-items: center; gap: 6px; color: #555; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #d33; }
.dot.on { background: #2e9d4a; }
details.menu { position: relative; }
details.menu > summary { list-style: none; cursor: pointer; padding: 3px 12px; border-radius: 3px; }
details.menu > summary::-webkit-details-marker { display: none; }
details.menu[open] > summary, details.menu > summary:hover { background: #dde6f3; }
details.menu .items { position: fixed; z-index: 30; margin-top: 4px; background: #fbfbfb; border: 1px solid #b9b9b9; padding: 3px; display: grid; min-width: 170px; box-shadow: 0 6px 18px rgba(0,0,0,.2); }
details.menu .items button { border: 0; background: transparent; text-align: left; border-radius: 2px; }
details.menu .items button:hover { background: #dde6f3; }
.toolbar { display: flex; gap: 4px; padding: 4px 6px calc(4px + env(safe-area-inset-bottom)); background: var(--bar); border-top: 1px solid var(--bar-line);
  overflow-x: auto; align-items: center; scrollbar-width: thin; }
.toolbar > * { flex: none; }
.toolbar .sep { width: 10px; }
#moveNo { width: 62px; text-align: center; }
.error { color: #c62828; padding-left: 6px; }

/* main area: left panels | board | right panels (drawn over the wallpaper like YZY) */
.main { display: grid; grid-template-columns: 24% minmax(0, 1fr) 24%; min-height: 0; gap: 0; }
.left, .right { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.cv-box { position: relative; min-height: 0; }
.cv-box > canvas { position: absolute; inset: 0; display: block; }
#capBox { flex: 0 0 12.5%; min-height: 86px; }
#statBox { flex: 0 0 10%; min-height: 70px; }
#graphBox { flex: 1 1 auto; min-height: 110px; cursor: pointer; }
.comment { flex: 0 0 33%; min-height: 120px; margin: 4px 0 0; background: rgba(0,0,0,.78); border-radius: 12px 12px 0 0; color: #fff; display: flex; flex-direction: column; }
.tabs { display: flex; gap: 22px; padding: 10px 22px 0; font-size: 14px; }
.tabs span { padding-bottom: 5px; color: #9a9a9a; }
.tabs span.on { color: #fff; border-bottom: 2px solid #4b8bf5; }
#comment { flex: 1; overflow: auto; padding: 10px 12px; white-space: pre-wrap; font-size: 17px; line-height: 1.55; }
.engine-status { padding: 2px 2px 4px; color: #fff; font-size: 18px; line-height: 1.5; text-shadow: 0 1px 2px #000; }
.engine-status div { background: rgba(0,0,0,.45); display: inline-block; padding: 0 3px; }
.center { position: relative; min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; }
#board { display: block; touch-action: none; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
.main { touch-action: pan-x pan-y; }   /* two-finger gestures instead of pinch zoom */
#treeBox { flex: 0 0 26%; min-height: 90px; overflow: auto; background: rgba(0,0,0,.51); position: relative; }
#tree { display: block; }
.table-box { flex: 0 0 auto; height: 22%; min-height: 110px; overflow: auto; background: #fff; border-top: 1px solid #555; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; color: #000; }
th { position: sticky; top: 0; background: #eaeaea; font-weight: 400; padding: 2px 3px; border: 1px solid #d0d0d0; border-top: 0; }
td { text-align: center; padding: 0 3px; border-right: 1px solid #e3e3e3; cursor: pointer; line-height: 20px; }
tr.sel td { background: #cfe3ff; }
.mini-box { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 6px 4px; }
#mini { display: block; }

/* game-record import window */
#kifuDlg { width: min(760px, calc(100vw - 16px)); max-height: 82dvh; padding: 0; border: 1px solid #9a9a9a; border-radius: 6px;
  background: var(--bar); color: var(--bar-text); box-shadow: 0 12px 40px rgba(0,0,0,.45); }
#kifuDlg[open] { display: flex; flex-direction: column; }
#kifuDlg::backdrop { background: rgba(0,0,0,.35); }
.dlg-row { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--bar-line); flex-wrap: wrap; }
.dlg-row .spacer { flex: 1; }
#foxName { flex: 1 1 160px; min-width: 0; }
.muted { color: #777; }
.dlg-msg { padding: 6px 10px; min-height: 28px; color: #555; }
.dlg-msg.bad { color: #c62828; }
.dlg-list { overflow: auto; min-height: 0; flex: 1 1 auto; background: #fff; border-top: 1px solid var(--bar-line); }
.dlg-list td { line-height: 30px; white-space: nowrap; }
.dlg-list tbody tr:hover td { background: #e6f0ff; }

/* portrait (phones, tablets): board, win-rate bar right under it, tool buttons in the space left */
@media (orientation: portrait) {
  body { grid-template-rows: auto auto minmax(0, 1fr); }
  .main { display: flex; flex-direction: column; }
  .center { order: 1; }
  .left { order: 2; }
  #capBox, #graphBox, .comment, .engine-status, .right { display: none; }
  #statBox { flex: none; height: 72px; }
  .toolbar { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; align-content: start;
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); overflow-y: auto; border-top: 0; background: transparent; }
  .toolbar button, .toolbar input { min-height: 42px; padding: 2px; width: 100%; }
  .toolbar .sep { display: none; }
  /* rows: moves | analysis | move number & marks | editing */
  #first { order: 1; } #back10 { order: 2; } #back { order: 3; } #fwd { order: 4; } #fwd10 { order: 5; } #last { order: 6; }
  #analyze, #autoAnalyze, #autoPlay, #goMove, #promote, #resetBoard, #deleteNode { grid-column: span 2; }
  #analyze { order: 7; } #autoAnalyze { order: 8; } #autoPlay { order: 9; }
  #moveNo { order: 10; } #goMove { order: 11; } #pass { order: 12; } #nums { order: 13; } #coords { order: 14; }
  #promote { order: 15; } #resetBoard { order: 16; } #deleteNode { order: 17; }
  .toolbar .error { order: 18; grid-column: 1 / -1; color: #ff8a80; }
}
</style>
</head>
<body>
<header class="menubar">
  <details class="menu" id="fileMenu">
    <summary>파일</summary>
    <div class="items">
      <button id="openSgf">SGF 열기…</button>
      <button id="saveSgf">SGF 저장</button>
      <button id="copySgf">SGF 복사</button>
      <button id="pasteSgf">SGF 붙여넣기</button>
    </div>
  </details>
  <button id="newGame">신규대국</button>
  <button id="kifuOpen">기보 불러오기</button>
  <label class="check">덤 <input type="number" id="komi" value="6.5" step="0.5" min="-50" max="50"></label>
  <label class="check"><input type="checkbox" id="showOwner"> 형세</label>
  <label class="check"><input type="checkbox" id="showCands" checked> 후보수보기</label>
  <span class="spacer"></span>
  <span class="status"><span class="dot" id="dot"></span><span id="conn">연결 중…</span></span>
  <input type="file" id="fileInput" accept=".sgf,application/x-go-sgf" hidden>
</header>

<dialog id="kifuDlg" aria-label="기보 불러오기">
  <div class="dlg-row">
    <b>한큐바둑 기보</b>
    <span class="spacer"></span>
    <button id="kifuClose">닫기</button>
  </div>
  <form class="dlg-row" id="foxForm">
    <input type="text" id="foxName" placeholder="한큐바둑 닉네임" autocomplete="off" enterkeyhint="search">
    <button type="submit">검색</button>
    <span class="muted">최근 대국 약 100판</span>
  </form>
  <div class="dlg-msg" id="kifuMsg"></div>
  <div class="dlg-list"><table><thead><tr><th>날짜</th><th>흑</th><th>백</th><th>결과</th><th>수</th></tr></thead><tbody id="kifuRows"></tbody></table></div>
</dialog>

<div class="main">
  <aside class="left">
    <div class="cv-box" id="capBox"><canvas id="cap"></canvas></div>
    <div class="cv-box" id="statBox"><canvas id="stat"></canvas></div>
    <div class="cv-box" id="graphBox"><canvas id="graph" aria-label="승률 그래프"></canvas></div>
    <div class="comment">
      <div class="tabs"><span class="on">댓글</span><span>문제 수</span></div>
      <div id="comment"></div>
    </div>
    <div class="engine-status"><div id="engineName">KataGo</div><br><div id="hint">생각 멈춤 · 단축키=Space</div></div>
  </aside>

  <section class="center" id="boardBox"><canvas id="board" aria-label="바둑판"></canvas></section>

  <aside class="right">
    <div id="treeBox"><canvas id="tree" aria-label="변화도"></canvas></div>
    <div class="table-box">
      <table>
        <thead><tr><th>순서</th><th>승률</th><th>비짓</th><th>비중</th><th>리드</th></tr></thead>
        <tbody id="candRows"></tbody>
      </table>
    </div>
    <div class="mini-box" id="miniBox"><canvas id="mini" aria-label="변화 미리보기"></canvas></div>
  </aside>
</div>

<footer class="toolbar">
  <button id="analyze">▶ 분석 시작</button>
  <button id="autoAnalyze">자동분석</button>
  <span class="sep"></span>
  <button id="first" title="처음 (Home)">|&lt;</button>
  <button id="back10" title="10수 뒤로">&lt;&lt;</button>
  <button id="back" title="이전 (←)">&lt;</button>
  <input type="text" id="moveNo" inputmode="numeric" aria-label="수 번호">
  <button id="goMove">수순 이동</button>
  <button id="fwd" title="다음 (→)">&gt;</button>
  <button id="fwd10" title="10수 앞으로">&gt;&gt;</button>
  <button id="last" title="끝 (End)">&gt;|</button>
  <button id="autoPlay">자동착수</button>
  <span class="sep"></span>
  <button id="pass">패스</button>
  <button id="promote">주 변화로 지정</button>
  <button id="nums">수순</button>
  <button id="coords" class="on">좌표</button>
  <button id="resetBoard" class="pink">바둑판초기화</button>
  <button id="deleteNode" class="pink">지우기</button>
  <span class="error" id="err"></span>
</footer>

<script>
"use strict";
const N = 19, LETTERS = "ABCDEFGHJKLMNOPQRST", AUTO_VISITS = 400, AUTOPLAY_VISITS = 2000, UNLIMITED_VISITS = 1000000000;
const UI_FONT = getComputedStyle(document.documentElement).getPropertyValue("--ui-font").trim();
const WR_FONT = "'Open Sans', " + UI_FONT;   // YZY: fonts/OpenSans-Semibold.ttf
const WR_WEIGHT = 600;
const $ = id => document.getElementById(id);
const idx = (x, y) => y * N + x;
const gtp = (x, y) => LETTERS[x] + (N - y);
const parseGtp = s => { if (!s || s === "pass") return null; const x = LETTERS.indexOf(s[0]), y = N - parseInt(s.slice(1), 10); return (x >= 0 && y >= 0 && y < N) ? [x, y] : null; };
const other = c => c === "B" ? "W" : "B";
const T = Math.trunc;

// ------------------------------------------------------------------ game tree
function makeRoot(setup = {B: [], W: []}, toPlay = "B") {
  const grid = new Int8Array(N * N), num = new Int16Array(N * N);
  for (const [x, y] of setup.B) grid[idx(x, y)] = 1;
  for (const [x, y] of setup.W) grid[idx(x, y)] = 2;
  return {parent: null, children: [], move: null, grid, num, caps: {B: 0, W: 0}, ko: -1, toPlay, depth: 0, setup, analysis: null, comment: ""};
}
function neighbors(i) { const x = i % N, y = (i / N) | 0, out = []; if (x > 0) out.push(i - 1); if (x < N - 1) out.push(i + 1); if (y > 0) out.push(i - N); if (y < N - 1) out.push(i + N); return out; }
function groupAt(grid, i) {
  const color = grid[i], stones = [i], seen = new Set([i]); let libs = 0; const libSeen = new Set();
  for (let k = 0; k < stones.length; k++) for (const j of neighbors(stones[k])) {
    if (grid[j] === 0) { if (!libSeen.has(j)) { libSeen.add(j); libs++; } }
    else if (grid[j] === color && !seen.has(j)) { seen.add(j); stones.push(j); }
  }
  return {stones, libs};
}
// Returns {grid, captured[], ko} or null when illegal (occupied, suicide, ko).
function placeOn(grid, ko, color, x, y) {
  const i = idx(x, y);
  if (grid[i] !== 0 || i === ko) return null;
  const g = grid.slice(), me = color === "B" ? 1 : 2; g[i] = me;
  let captured = [];
  for (const j of neighbors(i)) if (g[j] === 3 - me) { const grp = groupAt(g, j); if (grp.libs === 0) { for (const s of grp.stones) g[s] = 0; captured = captured.concat(grp.stones); } }
  const own = groupAt(g, i);
  if (own.libs === 0) return null;
  const newKo = (captured.length === 1 && own.stones.length === 1 && own.libs === 1) ? captured[0] : -1;
  return {grid: g, captured, ko: newKo};
}
function play(node, color, xy) {  // xy null = pass
  const same = node.children.find(c => c.move.c === color && (xy ? (c.move.x === xy[0] && c.move.y === xy[1]) : c.move.pass));
  if (same) return same;
  let child;
  if (!xy) {
    child = {grid: node.grid, num: node.num, caps: {...node.caps}, ko: -1, move: {c: color, pass: true}};
  } else {
    const r = placeOn(node.grid, node.ko, color, xy[0], xy[1]);
    if (!r) return null;
    const num = node.num.slice(); for (const s of r.captured) num[s] = 0; num[idx(xy[0], xy[1])] = node.depth + 1;
    const caps = {...node.caps}; caps[color] += r.captured.length;
    child = {grid: r.grid, num, caps, ko: r.ko, move: {c: color, x: xy[0], y: xy[1]}};
  }
  Object.assign(child, {parent: node, children: [], toPlay: other(color), depth: node.depth + 1, analysis: null, comment: ""});
  node.children.push(child);
  return child;
}
function pathTo(node) { const p = []; for (let n = node; n; n = n.parent) p.push(n); return p.reverse(); }
function lineThrough(node) { const p = pathTo(node); let n = node; while (n.children.length) { n = n.children[0]; p.push(n); } return p; }
function movesOf(node) { return pathTo(node).slice(1).map(n => [n.move.c, n.move.pass ? "pass" : gtp(n.move.x, n.move.y)]); }

let root = makeRoot(), cur = root;

// ------------------------------------------------------------------ engine connection
const hashParams = new URLSearchParams(location.hash.slice(1));
const token = hashParams.get("t") || "";
// When the page is served by the website (not by the GPU itself), #u= names the member's own GPU.
const remoteGpu = /^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(hashParams.get("u") || "") ? hashParams.get("u") : "";
let ws = null, qn = 0, liveId = null, autoId = null, autoLine = [], autoDone = 0;
let analyzing = false, autoPlayColor = null, modelName = "", engineVersion = "";
const queries = new Map();  // id -> {node} or {line}

function connect() {
  if (!token) { $("conn").textContent = "주소에 접속 토큰이 없습니다"; return; }
  const base = remoteGpu ? remoteGpu.replace(/^https/, "wss") : (location.protocol === "https:" ? "wss://" : "ws://") + location.host;
  ws = new WebSocket(base + "/ws?t=" + encodeURIComponent(token));
  ws.onopen = () => {
    $("dot").classList.add("on"); $("conn").textContent = "GPU 연결됨"; $("err").textContent = "";
    send({id: "ver", action: "query_version"}); ping();
    if (analyzing) requestLive();
  };
  ws.onclose = () => { $("dot").classList.remove("on"); $("conn").textContent = "끊김 · 다시 연결 중"; setTimeout(connect, 2000); };
  ws.onmessage = ev => onMessage(JSON.parse(ev.data));
}
function send(obj) { if (ws && ws.readyState === 1) { ws.send(JSON.stringify(obj)); return true; } return false; }
function ping() { send({action: "ping", t: performance.now()}); }
setInterval(ping, 5000);

function baseQuery() {
  return {rules: "korean", komi: komi(), boardXSize: N, boardYSize: N, initialPlayer: root.toPlay,
          initialStones: [...root.setup.B.map(([x, y]) => ["B", gtp(x, y)]), ...root.setup.W.map(([x, y]) => ["W", gtp(x, y)])],
          includeOwnership: $("showOwner").checked};
}
function requestLive() {
  if (liveId) { send({id: "t" + (++qn), action: "terminate", terminateId: liveId}); queries.delete(liveId); liveId = null; }
  if (!analyzing) return;
  liveId = "q" + (++qn);
  queries.set(liveId, {node: cur});
  // No visit limit: analysis runs until the member stops it or moves (like YZY pondering).
  // Auto-play needs a finished search to pick its move, so only that case gets a limit.
  const visits = autoPlayColor === cur.toPlay ? AUTOPLAY_VISITS : UNLIMITED_VISITS;
  send({...baseQuery(), id: liveId, moves: movesOf(cur), maxVisits: visits, reportDuringSearchEvery: 0.3});
}
function store(node, msg, id) {
  const old = node.analysis;
  if (!old || node.aid === id || msg.rootInfo.visits >= old.rootInfo.visits) { node.analysis = msg; node.aid = id; }
}
function onMessage(msg) {
  if ("pong" in msg) {
    if (msg.model) modelName = msg.model;
    $("conn").textContent = `GPU 연결됨 · ${Math.round(performance.now() - msg.pong)} ms`; updateEngineName(); return;
  }
  if (msg.id === "ver" && msg.version) { engineVersion = msg.version; updateEngineName(); return; }
  if (msg.error) { if (!msg.id || queries.has(msg.id)) $("err").textContent = "엔진 오류: " + msg.error; return; }
  const q = queries.get(msg.id);
  if (!q || !msg.rootInfo) return;
  if (q.line) {  // auto analysis: one response per turn
    const node = q.line[msg.turnNumber];
    if (node) store(node, msg, msg.id);
    autoDone++; $("autoAnalyze").textContent = `자동분석 ${autoDone}/${q.line.length}`;
    if (autoDone >= q.line.length) stopAuto();
  } else {
    store(q.node, msg, msg.id);
    if (!msg.isDuringSearch && q.node === cur && autoPlayColor === cur.toPlay) setTimeout(() => autoMove(msg), 150);
  }
  schedule();
}
function autoMove(msg) {
  if (autoPlayColor !== cur.toPlay || cur.analysis !== msg) return;
  const best = candidates(cur)[0];
  if (best) goTo(play(cur, cur.toPlay, parseGtp(best.move)));
}
function startAuto() {
  autoLine = lineThrough(cur); autoDone = 0; autoId = "a" + (++qn);
  queries.set(autoId, {line: autoLine});
  send({...baseQuery(), includeOwnership: false, id: autoId, moves: movesOf(autoLine[autoLine.length - 1]),
        analyzeTurns: autoLine.map((_, i) => i), maxVisits: AUTO_VISITS});
  $("autoAnalyze").classList.add("on"); $("autoAnalyze").textContent = `자동분석 0/${autoLine.length}`;
}
function stopAuto() {
  if (autoId && autoDone < autoLine.length) send({id: "t" + (++qn), action: "terminate", terminateId: autoId});
  queries.delete(autoId); autoId = null;
  $("autoAnalyze").classList.remove("on"); $("autoAnalyze").textContent = "자동분석";
}
function engineLabel() { return ["KataGo" + (engineVersion ? " " + engineVersion : ""), modelName].filter(Boolean).join(" · "); }
function updateEngineName() { $("engineName").textContent = engineLabel(); }
function komi() { const v = parseFloat($("komi").value); return Number.isFinite(v) ? v : 6.5; }

// ------------------------------------------------------------------ navigation / actions
function goTo(node) {
  if (!node) return;
  cur = node; selectedPv = null; hover = null;
  requestLive(); schedule();
}
function step(k) { let n = cur; for (let i = 0; i < Math.abs(k); i++) n = k > 0 ? (n.children[0] || n) : (n.parent || n); goTo(n); }

    i++; return {nodes, vars};
  }

}

}

  width = T(width * .98);
  const X = k => posx + T(k * width / numMoves), Yw = wr => posy + height - T(wr * height / 100);
  const pts = line.map((node, k) => { const s = nodeStats(node); return s ? {k, wr: s.blackWr, lead: s.blackLead, node} : null; }).filter(Boolean);
  let maxScore = 15; for (const p of pts) maxScore = Math.max(maxScore, Math.abs(p.lead));
  // score lead (black perspective), 1.0 px
  g.strokeStyle = SCORE_LINE; g.lineWidth = 1;
  for (let j = 1; j < pts.length; j++) { const a = pts[j - 1], b = pts[j]; if (b.k - a.k >= 25) continue;
    g.beginPath(); g.moveTo(X(a.k), posy + height / 2 - T(a.lead * height / 2 / maxScore)); g.lineTo(X(b.k), posy + height / 2 - T(b.lead * height / 2 / maxScore)); g.stroke(); }
  // win rate (black perspective), 1.7 px; gaps drawn dashed in the miss colour
  g.lineWidth = 1.7;
  for (let j = 1; j < pts.length; j++) { const a = pts[j - 1], b = pts[j]; if (b.k - a.k >= 25) continue;
    const gap = b.k - a.k > 1; g.strokeStyle = gap ? WR_MISS : WR_LINE; g.setLineDash(gap ? [4, 4] : []);
    g.beginPath(); g.moveTo(X(a.k), Yw(a.wr)); g.lineTo(X(b.k), Yw(b.wr)); g.stroke(); }
  g.setLineDash([]);
  // current move: dot + value
  const cs = nodeStats(cur);
  if (cs) {
    const cx = X(cur.depth), cy = Math.max(posy + 3, Math.min(posy + height - 3, Yw(cs.blackWr)));
    g.fillStyle = WR_LINE; g.beginPath(); g.arc(cx, cy, 3, 0, Math.PI * 2); g.fill();
    g.font = `700 16px ${UI_FONT}`; g.fillStyle = cur.toPlay === "B" ? WR_LINE : "#fff"; g.textBaseline = "alphabetic";
    const s = cs.blackWr.toFixed(1), sw = g.measureText(s).width;
    const tx = Math.min(Math.max(cx - sw / 2, 0), graphW - sw);
    const ty = cs.blackWr > 50 ? (cs.blackWr > 90 ? cy + 18 : cy - 6) : (cs.blackWr < 10 ? cy - 6 : cy + 18);
    g.fillText(s, tx, ty);
  }
  // current move marker (red dot with light halo) on the 50% line
  const mx = X(cur.depth), my = posy + T(height / 2);
  g.fillStyle = "rgba(255,250,240,.88)"; g.beginPath(); g.arc(mx, my, 6, 0, Math.PI * 2); g.fill();
  g.fillStyle = "rgb(244,67,72)"; g.beginPath(); g.arc(mx, my, 4, 0, Math.PI * 2); g.fill();
  g.strokeStyle = "rgba(112,24,28,.9)"; g.lineWidth = 1; g.beginPath(); g.arc(mx, my, 4, 0, Math.PI * 2); g.stroke();
}
graphCv.addEventListener("click", ev => {
  const rect = graphCv.getBoundingClientRect(), line = lineThrough(cur), numMoves = Math.max(50, line.length - 1);
  const k = Math.round((ev.clientX - rect.left) / (T((graphW - 6) * .98)) * numMoves); goTo(line[Math.max(0, Math.min(line.length - 1, k))]);
});

// ------------------------------------------------------------------ variation tree (VariationTree.java)
const treeCv = $("tree"), XS = 20, YS = 20, DOT = 11, CENTER = 5;
const BLUNDER_T = [-24, -12, -6, -3, -1, 3, 100];
const BLUNDER_C = [[155, 25, 150], [208, 16, 19], [200, 140, 50], [180, 180, 0], [140, 202, 34], [0, 220, 0], [0, 230, 230]];
function blunderColor(node) {
  const a = node.parent && nodeStats(node.parent), b = nodeStats(node);
  if (!a || !b || !node.move) return "#fff";
  const diff = (100 - b.wr) - a.wr;   // mover's win-rate change
  const k = BLUNDER_T.findIndex(t => t >= diff);
  return k >= 0 ? `rgb(${BLUNDER_C[k].join(",")})` : "#fff";
}
let treeHits = [];
function drawTree() {
  const box = $("treeBox"); if (getComputedStyle(box).display === "none") return;
  const cells = []; let maxLane = 0, maxDepth = 0;
  const stack = [[root, 0]];
  while (stack.length) {
    const [nd, lane] = stack.pop(); cells.push([nd, lane]); maxDepth = Math.max(maxDepth, nd.depth);
    for (let k = nd.children.length - 1; k >= 1; k--) { maxLane++; stack.push([nd.children[k], maxLane]); }
    if (nd.children[0]) stack.push([nd.children[0], lane]);
  }
  const trunk = new Set(lineThrough(cur));
  // Content size only: sizing to the box made scrollbars appear/disappear every frame (flicker).
  const W = (maxLane + 1) * XS + 20, H = (maxDepth + 1) * YS + 20;
  const g = sizeCanvas(treeCv, W, H);
  const lanes = new Map(cells);
  const pos = n => [10 + lanes.get(n) * XS, 10 + n.depth * YS];
  treeHits = [];
  for (const [nd] of cells) if (nd.parent) {  // lines
    const [x, y] = pos(nd), [px, py] = pos(nd.parent);
    g.strokeStyle = trunk.has(nd) ? "#fff" : "rgb(103,103,103)"; g.lineWidth = 1; g.beginPath();
    if (x === px) { g.moveTo(x + 5.5, py + DOT); g.lineTo(x + 5.5, y); }
    else { g.moveTo(px + 5.5 + 5, py + 5.5); g.lineTo(x + 5.5 - XS + 5, py + 5.5); g.lineTo(x + 5.5, y + 5.5); }
    g.stroke();
  }
  for (const [nd] of cells) {
    const [x, y] = pos(nd); treeHits.push({node: nd, x: x + 5.5, y: y + 5.5});
    if (!nd.parent) {
      g.fillStyle = "#fff"; g.fillRect(x, y, DOT, DOT); g.strokeStyle = "#000"; g.strokeRect(x - .5, y - .5, DOT + 1, DOT + 1);
      if (nd === cur) { g.fillStyle = "#f00"; g.fillRect(x + 2, y + 2, DOT - 4, DOT - 4); }
      continue;
    }
    g.fillStyle = blunderColor(nd); g.beginPath(); g.arc(x + 5.5, y + 5.5, DOT / 2, 0, Math.PI * 2); g.fill();
    if (!trunk.has(nd)) { g.fillStyle = "rgba(0,0,0,.153)"; g.fill(); }
    if (nd === cur) { g.fillStyle = "#000"; g.beginPath(); g.arc(x + 5.5, y + 5.5, CENTER / 2, 0, Math.PI * 2); g.fill(); }
  }
  const [cx, cy] = pos(cur);
  if (cy < box.scrollTop + 20 || cy > box.scrollTop + box.clientHeight - 30) box.scrollTop = cy - box.clientHeight / 2;
  if (cx < box.scrollLeft + 20 || cx > box.scrollLeft + box.clientWidth - 30) box.scrollLeft = cx - box.clientWidth / 2;
}
treeCv.addEventListener("click", ev => {
  const rect = treeCv.getBoundingClientRect(), x = ev.clientX - rect.left, y = ev.clientY - rect.top;
  const hit = treeHits.find(h => Math.abs(h.x - x) < 9 && Math.abs(h.y - y) < 9); if (hit) goTo(hit.node);
});

// ------------------------------------------------------------------ table, comment
function drawSide() {
  $("moveNo").value = cur.depth;
  const cands = candidates(cur), total = cands.reduce((s, c) => s + c.visits, 0) || 1;
  const selMove = selectedPv && selectedPv[0];
  $("candRows").innerHTML = cands.map((c, k) =>
    `<tr data-k="${k}"${c.move === selMove ? ' class="sel"' : ""}><td>${k + 1}</td><td>${moverWr(cur, c.winrate).toFixed(1)}</td><td>${c.visits}</td><td>${(c.visits / total * 100).toFixed(1)}</td><td>${moverLead(cur, c.scoreLead).toFixed(1)}</td></tr>`).join("");
  const s = nodeStats(cur);
  let text = "";
  if (s) {  // append-winrate-to-comment: shown for the player who made the last move
    const who = cur.toPlay === "B" ? "백" : "흑";
    text = `${who} 승률: ${(100 - s.wr).toFixed(1)}%\n리드: ${(-s.score).toFixed(1)}   표준편차: ${s.stdev.toFixed(1)}\n(${engineLabel().replace(/ /g, "")} / ${s.visits} 방문)\n덤: ${komi()}`;
  }
  $("comment").textContent = [cur.comment, text].filter(Boolean).join("\n\n");
}
$("candRows").addEventListener("click", ev => { const tr = ev.target.closest("tr"); if (!tr) return; const c = candidates(cur)[+tr.dataset.k]; if (c) { selectedPv = c.pv || null; schedule(); } });
$("candRows").addEventListener("dblclick", ev => { const tr = ev.target.closest("tr"); if (!tr) return; const c = candidates(cur)[+tr.dataset.k]; if (c) goTo(play(cur, cur.toPlay, parseGtp(c.move))); });

// ------------------------------------------------------------------ layout & render loop
function fitBox(el) { const r = el.getBoundingClientRect(); return [Math.floor(r.width), Math.floor(r.height)]; }
function layout() {
  const [bw, bh] = fitBox($("boardBox"));
  // portrait: as wide as the screen, leaving room for the win-rate bar and two rows of buttons
  const side = matchMedia("(orientation: portrait)").matches
    ? Math.min(document.documentElement.clientWidth, innerHeight - document.querySelector(".menubar").offsetHeight - $("statBox").offsetHeight - 110)
    : Math.min(bw, bh);
  const k = dpr();
  boardG = geometry(Math.floor(side * k), $("coords").classList.contains("on"), k);
  boardCtx = sizeCanvasDevice(boardCv, boardG.size);
  [capW, capH] = fitBox($("capBox")); capCtx = sizeCanvas(capCv, capW, capH);
  [statW, statH] = fitBox($("statBox")); statCtx = sizeCanvas(statCv, statW, statH);
  [graphW, graphH] = fitBox($("graphBox")); graphCtx = sizeCanvas(graphCv, graphW, graphH);
  if (getComputedStyle($("miniBox")).display !== "none") {
    const [mw, mh] = fitBox($("miniBox"));
    miniG = geometry(Math.floor(Math.max(60, Math.min(mw - 8, mh - 12)) * k), false, k); miniCtx = sizeCanvasDevice(miniCv, miniG.size);
  } else miniCtx = null;
  snapToPixels(boardCv); if (miniCtx) snapToPixels(miniCv);
  render();   // right away: resizing cleared the canvases, drawing a frame later shows them blank (flicker)
}
window.addEventListener("scroll", () => requestAnimationFrame(() => snapToPixels(boardCv)), {passive: true});
let pending = false;
function schedule() {
  if (pending) return; pending = true;
  requestAnimationFrame(() => { pending = false; render(); });
}
function render() { drawMain(); drawMini(); drawCaptured(); drawStatistics(); drawGraph(); drawTree(); drawSide(); }
// Re-lay out only when the window really changes; text/table updates must not clear the canvases.
let lastSize = "";
new ResizeObserver(() => { const s = `${innerWidth}x${innerHeight}x${dpr()}`; if (s !== lastSize) { lastSize = s; layout(); } }).observe(document.documentElement);
document.fonts && document.fonts.ready.then(schedule);
layout(); connect();
</script>
</body>
