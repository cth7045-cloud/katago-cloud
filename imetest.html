<!doctype html>
<!-- 한글 입력 시험 (2026-11-17, 임시): 아이폰 카카오톡 브라우저에서 어떤 키보드로 기보실 찾기 칸의 첫 글자 모음이 안 쳐지던 것의
     원인을 가리려고. 칸마다 한 가지만 다르게 하고, 키보드가 보내는 이벤트를 아래에 적음. 원인을 찾으면 지운다. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>입력 시험</title>
<style>
  :root { --bg: #fff; --ink: #1d1d1f; --muted: #6e6e73; --line: #d2d2d7; --soft: #f5f5f7; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --ink: #f5f5f7; --muted: #a1a1a6; --line: #38383a; --soft: #1c1c1e; } }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  label { display: block; font-size: 14px; color: var(--muted); margin: 14px 0 4px; }
  input { box-sizing: border-box; width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
  #log { margin: 14px 0 0; padding: 10px; min-height: 120px; max-height: 260px; overflow: auto; background: var(--soft); border-radius: 10px;
    font: 12px/1.4 ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-all; }
  button { font: inherit; font-size: 14px; margin-top: 8px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
  #long p { margin: 0; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .hidden { display: none; }
</style>
</head>
<body>
<h1>입력 시험</h1>
<label for="t1">① 아무것도 안 하는 칸</label>
<input type="search" id="t1" autocomplete="off" enterkeyhint="search">
<label for="t2">② 첫 글자에 방문 기록을 더하는 칸</label>
<input type="search" id="t2" autocomplete="off" enterkeyhint="search">
<label for="t3">③ 첫 글자에 아래 목록을 바꾸는 칸</label>
<input type="search" id="t3" autocomplete="off" enterkeyhint="search">
<label for="t4">④ 보통 글자 칸</label>
<input type="text" id="t4" autocomplete="off">
<div id="log"></div>
<button type="button" id="clear">기록 지우기</button>
<div id="long"></div>
<div id="short" class="hidden"><p>찾은 것 (시험)</p></div>
<script>
  const log = document.getElementById("log"), long = document.getElementById("long"), short = document.getElementById("short");
  long.innerHTML = Array.from({ length: 60 }, (_, i) => `<p>목록 ${i + 1}</p>`).join("");
  let t0 = 0, lines = [];
  const show = (s) => { lines.unshift(`${String(Math.round(performance.now() - t0)).padStart(5)} ${s}`); lines = lines.slice(0, 60); log.textContent = lines.join("\n"); };
  const q = (v) => JSON.stringify(v);
  for (const id of ["t1", "t2", "t3", "t4"]) {
    const el = document.getElementById(id), n = id.slice(1);
    el.addEventListener("focus", () => { t0 = performance.now(); show(`${n} focus`); });
    el.addEventListener("blur", () => show(`${n} blur`));
    el.addEventListener("keydown", (e) => show(`${n} keydown ${q(e.key)} ${e.keyCode}${e.isComposing ? " comp" : ""}`));
    for (const t of ["compositionstart", "compositionupdate", "compositionend"]) el.addEventListener(t, (e) => show(`${n} ${t.slice(11)} ${q(e.data)}`));
    el.addEventListener("beforeinput", (e) => show(`${n} before ${e.inputType} ${q(e.data)}${e.isComposing ? " comp" : ""}`));
    el.addEventListener("input", (e) => {
      show(`${n} input ${e.inputType} ${q(e.data)}${e.isComposing ? " comp" : ""} → ${q(el.value)}`);
      if (id === "t2" && el.value && !(history.state && history.state.t)) { history.pushState({ t: 1 }, "", location.href); show("2 방문 기록 더함"); }
      if (id === "t3") setTimeout(() => { const on = !!el.value; long.classList.toggle("hidden", on); short.classList.toggle("hidden", !on); }, 120);
    });
  }
  document.getElementById("clear").onclick = () => { lines = []; log.textContent = ""; };
</script>
</body>
</html>
